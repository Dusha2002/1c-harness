[package]
name = "onec-harness-desktop"
version = "0.4.0"
description = "Desktop UI for 1C Harness"
authors = ["Dusha2002"]
edition = "2021"

[lib]
name = "onec_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

rfd = "0.16"
