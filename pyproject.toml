[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "onec-harness"
version = "0.2.0"
description = "Model-agnostic AI harness for safe 1C:Enterprise development and automation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dusha2002" }]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "rich>=13.8,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
windows = [
  "pywin32>=306; platform_system == 'Windows'",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
onec-harness = "onec_harness.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/onec_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/onec_harness/agent.py" = ["E501"]
"src/onec_harness/onec/e2e.py" = ["E501"]
"src/onec_harness/semantic_extra.py" = ["E501"]
"src/onec_harness/semantic_registers.py" = ["E501"]
"src/onec_harness/semantic_forms.py" = ["E501"]
