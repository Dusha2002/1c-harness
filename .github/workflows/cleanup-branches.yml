name: cleanup merged branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete superseded branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in             "codex/desktop-readiness-v04"             "feat/desktop-onboarding"             "feat/final-consolidation"             "feat/v0.3-forms-extensions-mcp"
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
