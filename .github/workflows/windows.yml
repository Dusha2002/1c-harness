name: Windows desktop
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e .[windows,dev] pyinstaller
      - run: python -m pytest -q
      - run: python scripts/build_sidecar.py
      - name: Smoke test packaged bridge
        shell: pwsh
        run: |
          $env:ONEC_HARNESS_CONFIG_DIR = "$env:RUNNER_TEMP/harness-smoke"
          '{"op":"settings"}' | .\dist\onec-harness-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '{"op":"save_settings","values":{"llm_api_key":"smoke-only"}}' | .\dist\onec-harness-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          '{"op":"settings"}' | .\dist\onec-harness-bridge.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npm run tauri build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: 1C-Harness-Windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
